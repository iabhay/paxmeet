<div class="row justify-content-center">
    <div class="col">
        <div class="section-title text-center mb-4 pb-2">
            <h4 class="title mb-3">How we works? : paxmeet</h4>
            <p class="text-muted para-desc mb-0 mx-auto">Welcome to the future, you can explore and use awesome agents form here. The world largest digital marketplace for AI Agents.</p>
        </div>
    </div><!--end col-->
</div><!--end row-->

<div class="row">
    <div *ngFor="let item of servicesData" class="col-lg-4 col-md-6 col-12 mt-4 pt-2">
        <div class="position-relative features text-center p-4">
            <div class="position-relative d-flex justify-content-center">
                <i [attr.data-feather]="item.icon" class="fea icon-md text-primary z-1"></i>
                <div class="feature-icon bg-soft-primary position-absolute top-0 translate-middle"></div>
            </div>

            <div class="mt-4">
                <a [routerLink]="'/service-detail'" class="h5 text-dark link-title">{{item.title}}</a>
                <p class="text-muted mt-3">{{item.desc}}</p>
                <a [routerLink]="'/service-detail'" class="text-primary">Learn More <i class="mdi mdi-arrow-right align-middle"></i></a>
            </div>
        </div>
    </div><!--end col-->
</div><!--end row-->
