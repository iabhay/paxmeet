
<!-- Start -->
<section class="section border-top" id="explore">
  <div class="container">
      <div class="row align-items-end mb-4 pb-2">
          <div class="col-md-8">
              <div class="section-title">
                  <h4 class="title mb-1">Create Event</h4>
              </div>
          </div><!--end slide-->
      </div><!--end row-->
      <div class="header-event">
        <!-- Large button groups (default and split) -->
        <div class="btn-group">
          <button
            class="btn btn-primary btn-md dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            >
            {{ event }}
          </button>
          <ul class="dropdown-menu">
            <li>
              <a
              class="dropdown-item"
              *ngFor="let item of items"
              (click)="handleEventType(item)"
              >{{ item }}</a
              >
            </li>
          </ul>
        </div>
        <div class="btn-group">
        <p-calendar [(ngModel)]="startDate"></p-calendar>
      </div>
      <div class="btn-group">
        <p-calendar [(ngModel)]="endDate"></p-calendar>
      </div>
        <div class="btn-group">
          <button
            class="btn btn-primary btn-md dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            >
            {{ cityType }}
          </button>
          <ul class="dropdown-menu">
            <li>
              <a
              class="dropdown-item"
              *ngFor="let city of cities"
              (click)="handleCityType(city)"
              >{{ city }}</a
              >
            </li>
          </ul>
        </div>
      </div>
      <div class="containert">
        <div class="container1">
          <textarea
          id="event"
          (click)="handleClick()"
          (mouseout)="handleClick()"
          >{{ eventDescription }}</textarea
          >
        </div>
        <div class="container2">
          <button
            class="btn btn-post btn-md"
            type="button"
            data-bs-toggle="btn"
            aria-expanded="false"
          >
            {{ "Post" }}
          </button>
        </div>
      </div>
    </div><!--end container-->
</section><!--end section-->
<!-- End -->
