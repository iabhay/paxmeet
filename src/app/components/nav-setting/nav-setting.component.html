<ul class="buy-button list-inline mb-0">
    <li class="list-inline-item mb-0">
        <div class="dropdown">
            <ng-container *ngIf="navDark; else elseTemplate">
                <button type="button" class="dropdown-toggle btn btn-sm p-0 border-0" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    <i data-feather="search" class="fea icon-20"></i>
                </button>
            </ng-container>
            <ng-template #elseTemplate>
                <button type="button" class="dropdown-toggle btn btn-sm p-0 border-0" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    <i data-feather="search" class="fea icon-20 login-btn-primary"></i>
                    <i data-feather="search" class="fea icon-20 text-white login-btn-light"></i>
                </button>
            </ng-template>
            <div class="dropdown-menu dd-menu dropdown-menu-end bg-white rounded border-0 mt-3 p-0" style="width: 240px;">
                <div class="search-bar">
                    <div id="itemSearch" class="menu-search mb-0">
                        <form role="search" method="get" id="searchItemform" class="searchform">
                            <input type="text" class="form-control rounded border" name="s" id="searchItem" placeholder="Search...">
                            <input type="submit" id="searchItemsubmit" value="Search">
                            <i data-feather="search" class="icons"></i>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </li>

    <li class="list-inline-item ps-1 mb-0">
        
        <a href="javascript:void(0)" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRight" aria-controls="offcanvasRight">
            <div class="btn btn-sm btn-icon btn-pills btn-primary"><i data-feather="settings" class="fea icon-sm"></i></div>
        </a>
        
    </li>

    <li class="list-inline-item ps-1 mb-0">
        <div class="btn btn-sm btn-icon btn-pills btn-primary"><i data-feather="dollar-sign" class="fea icon-sm"></i></div>
    </li>

    <li class="list-inline-item ps-1 mb-0">
        <div class="dropdown dropdown-primary">
            <button type="button" class="btn btn-pills dropdown-toggle p-0" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false"><img [src]="'assets/images/team/1.jpg'" class="rounded-pill avatar avatar-ex-small" alt=""></button>
            <div class="dropdown-menu dd-menu dropdown-menu-end bg-white shadow border-0 mt-3 pb-3 pt-0 overflow-hidden rounded" style="min-width: 200px;">
                <div class="position-relative">
                    <div class="p-3">
                        <div class="d-flex align-items-center mt-n4">
                            <img [src]="'assets/images/team/1.jpg'" class="rounded-pill avatar avatar-md-sm img-thumbnail shadow-md" alt="">
                            <h6 class="text-dark fw-semibold mb-0 ms-1">Calvin Carlo</h6>
                        </div>
                        <div class="mt-3">
                            <small class="text-start text-dark d-block fw-semibold">Wallet:</small>
                            <div class="d-flex justify-content-between align-items-center">
                                <small id="myPublicAddress" class="text-muted">qhutfvf0...hfteh45</small>
                                <a [routerLink]="" (click)="$event.preventDefault()" class="text-primary"><span data-feather="copy" class="fea icon-sm"></span></a>
                            </div>
                        </div>
                        
                        <div class="mt-2">
                            <small class="text-dark fw-semibold">Balance: <span class="text-primary">0.00045ETH</span></small>
                        </div>
                    </div>
                </div>
                <div class="mt-2">
                    <a class="dropdown-item small fw-semibold text-dark d-flex align-items-center" [routerLink]="'/creator-profile'"><span class="mb-0 d-inline-block me-1"><i data-feather="user" class="fea icon-sm me-1 align-middle"></i></span> Profile</a>
                    <a class="dropdown-item small fw-semibold text-dark d-flex align-items-center" [routerLink]="'/profile-setting'"><span class="mb-0 d-inline-block me-1"><i data-feather="settings" class="fea icon-sm me-1 align-middle"></i></span> Settings</a>
                    <div class="dropdown-divider border-top"></div>
                    <a class="dropdown-item small fw-semibold text-dark d-flex align-items-center" [routerLink]="'/lock-screen'"><span class="mb-0 d-inline-block me-1"><i data-feather="log-out" class="fea icon-sm me-1 align-middle"></i></span> Logout</a>
                </div>
            </div>
        </div>
    </li>
</ul>

<div class="offcanvas offcanvas-end shadow border-0" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
    <div class="offcanvas-header p-4 border-bottom">
        <h5 id="offcanvasRightLabel" class="mb-0">
            <img [height]="'50px'" [src]="'assets/images/Lucna_logo.png'" class="logo-light-mode" alt="">
            <img [height]="'50px'" [src]="'assets/images/Lucna_logo.png'" class="logo-dark-mode" alt="">
        </h5>
        <button type="button" class="btn-close d-flex align-items-center text-dark" data-bs-dismiss="offcanvas" aria-label="Close"><i class="mdi mdi-close fs-4"></i></button>
    </div>
    <div class="offcanvas-body p-4">
        <div class="row">
            <div class="col-12">
                <img [src]="'assets/images/contact.png'" class="img-fluid" alt="">
                <form>
                    <div class="my-3 text-center">
                        <h6 class="text-uppercase mb-0 fw-semibold">Sign In</h6>
                    </div>
                
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Your Email</label>
                        <input name="email" id="email" type="email" class="form-control" placeholder="example@website.com">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="loginpass">Password</label>
                        <input type="password" class="form-control" id="loginpass" placeholder="Password">
                    </div>
                
                    <div class="d-flex justify-content-between">
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
                                <label class="form-label form-check-label text-muted" for="flexCheckDefault">Remember me</label>
                            </div>
                        </div>
                        <span class="forgot-pass text-muted small mb-0"><a [routerLink]="'/reset-password'" class="text-muted">Forgot password ?</a></span>
                    </div>
    
                    <button class="btn btn-primary w-100" type="submit">Sign in</button>

                    <div class="col-12 text-center mt-3">
                        <span><span class="text-muted me-2 small">Don't have an account ?</span> <a [routerLink]="['/signup']" class="text-dark fw-semibold small">Sign Up</a></span>
                    </div><!--end col-->
                </form>
            </div>
        </div>
    </div>

    <div class="offcanvas-footer p-4 border-top text-center">
        <ul class="list-unstyled social-icon mb-0">
            <li class="list-inline-item me-1"><a href="https://dribbble.com/shreethemes" target="_blank" class="rounded"><i data-feather="dribbble" class="fea icon-sm align-middle" title="dribbble"></i></a></li>
            <li class="list-inline-item me-1"><a href="http://linkedin.com/company/shreethemes" target="_blank" class="rounded"><i data-feather="linkedin" class="fea icon-sm align-middle" title="Linkedin"></i></a></li>
            <li class="list-inline-item me-1"><a href="https://www.facebook.com/shreethemes" target="_blank" class="rounded"><i data-feather="facebook" class="fea icon-sm align-middle" title="facebook"></i></a></li>
            <li class="list-inline-item me-1"><a href="https://www.instagram.com/shreethemes/" target="_blank" class="rounded"><i data-feather="instagram" class="fea icon-sm align-middle" title="instagram"></i></a></li>
            <li class="list-inline-item me-1"><a href="https://twitter.com/shreethemes" target="_blank" class="rounded"><i data-feather="twitter" class="fea icon-sm align-middle" title="twitter"></i></a></li>
        </ul><!--end icon-->
    </div>
</div>
