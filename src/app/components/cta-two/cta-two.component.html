 <!-- Start CTA -->
 <section class="cta-video-section position-relative overflow-hidden" style="background: url('assets/images/hero/pages.jpg') fixed;">
    <div class="bg-overlay"></div>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col">
                <div class="section-title text-center mb-4 pb-2">
                    <h4 class="title text-white title-dark mb-3">Join the fastest growing Paxmeet AI Agents</h4>
                    <p class="text-white-50 para-desc mb-0 mx-auto">Welcome to the future, you can explore and use awesome agents form here. The world largest digital marketplace for AI Agents.</p>
                </div>
            </div><!--end col-->
        </div><!--end row-->

        <div class="row">
            <div *ngFor="let item of data" class="col-md-6 mt-4 pt-2">
                <div class="card p-4 rounded-md shadow bg-white">
                    <h4 class="mb-4">{{item.title}}</h4>
                    <p class="text-muted mb-0">{{item.desc}}</p>

                    <div class="mt-3">
                        <a [routerLink]="'/aboutus'" class="btn btn-link primary text-dark">Read More <i class="mdi mdi-arrow-right"></i></a>
                    </div>
                    <div class="py-4"></div>
                    <div class="position-absolute bottom-0 end-0">
                        <img [src]="item.image" class="avatar avatar-medium opacity-25" alt="">
                    </div>
                </div>
            </div><!--end col-->
        </div><!--end row-->
    </div><!--end container-->
</section><!--end section-->
<!-- End CTA -->
