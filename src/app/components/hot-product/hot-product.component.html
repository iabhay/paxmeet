<div class="row">
    <div *ngFor="let item of AgentsData | slice:0:8" class="col-lg-3 col-md-4 col-sm-6 col-12 mt-4 pt-2">
        <div class="nft-item p-4 rounded shadow bg-white">
            <div class="position-relative">
                <div class="nft-image position-relative overflow-hidden rounded shadow">
                    <img [src]="item.image" class="img-fluid" alt="">
                    <div class="bg-overlay bg-black"></div>
                    <div class="bid-button position-absolute bottom-0 start-0 end-0 text-center pb-3">
                        <a [routerLink]="['/nft-detail', item.id]" class="btn btn-sm btn-icon btn-pills btn-primary me-1" data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-title="Explore Now"><i data-feather="zap" class="fea icon-sm align-middle"></i></a>
                        <!-- <a [routerLink]="['/nft-detail', item.id]" class="btn btn-sm btn-icon btn-pills btn-primary" data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-title="Bid Now"><i data-feather="zap" class="fea icon-sm align-middle"></i></a> -->
                    </div>
                </div>

                <div class="position-absolute top-0 start-0 m-3">
                    <a [routerLink]="['/creator-profile', item.id]"><img [src]="item.user" class="avatar avatar-md-sm rounded-pill shadow img-thumbnail object-fit-cover" alt=""></a>
                </div>
            </div>

            <div class="content pt-4 position-relative">
                <a [routerLink]="['/nft-detail', item.id]" class="text-dark link-title h6">{{item.title}}</a>

                <div class="d-flex justify-content-between mt-2">
                    <!-- <span class="rate text-primary">Use</span> -->
                    <span class="text-dark" style="opacity: 0.7;">{{item.subtitle}}</span>
                </div>
            </div>
        </div>
    </div><!--end col-->
</div><!--end row-->
